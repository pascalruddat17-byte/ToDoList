<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171a1f" />
    <meta
      name="description"
      content="Eine mobile To-do-App mit Kategorien und anpassbaren Farben."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Pulse Tasks</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --app-bg: #f5f4ee;
        --app-surface: #fffefa;
        --app-accent: #246bfe;
        --app-ink: #171a1f;
        --app-radius: 1.05rem;
        --density-pad: 0.72rem;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--app-bg);
        color: var(--app-ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app-root {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 16% 0%,
            color-mix(in srgb, var(--app-accent) 22%, transparent),
            transparent 26rem
          ),
          linear-gradient(
            160deg,
            var(--app-bg) 0%,
            color-mix(in srgb, var(--app-bg) 82%, #000 18%) 100%
          );
      }

      .phone-shell {
        display: flex;
        min-height: 100vh;
        width: 100%;
        max-width: 480px;
        flex-direction: column;
        margin: 0 auto;
        padding: 1rem;
      }

      .app-topbar,
      .category-panel-head,
      .task-line,
      .task-meta {
        display: flex;
        align-items: center;
      }

      .app-topbar {
        justify-content: space-between;
        gap: 1rem;
        padding: 0.2rem 0 0.75rem;
      }

      .eyebrow,
      .hero-kicker {
        margin: 0 0 0.2rem;
        color: color-mix(in srgb, var(--app-ink) 62%, transparent);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 12ch;
        margin-bottom: 0;
        font-size: 2.35rem;
        font-weight: 950;
        line-height: 0.96;
        overflow-wrap: anywhere;
      }

      .icon-button,
      .add-button,
      .check-button,
      .delete-button,
      .quick-category-form button,
      .category-form button,
      .reset-button {
        display: grid;
        place-items: center;
        border: 0;
        cursor: pointer;
      }

      .icon-button {
        width: 2.65rem;
        height: 2.65rem;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--app-ink);
        color: var(--app-surface);
        font-size: 1.2rem;
      }

      .view-tabs,
      .filters {
        display: grid;
        gap: 0.35rem;
        border: 1px solid color-mix(in srgb, var(--app-ink) 12%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--app-surface) 72%, transparent);
        padding: 0.3rem;
      }

      .view-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 0.9rem;
      }

      .filters {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 0.85rem;
      }

      .view-tabs button,
      .filters button,
      .category-grid button,
      .priority-group button,
      .segmented-field button,
      .palette-grid button {
        min-width: 0;
        border: 0;
        background: transparent;
        color: color-mix(in srgb, var(--app-ink) 68%, transparent);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 850;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .view-tabs button,
      .filters button {
        min-height: 2.55rem;
        border-radius: 999px;
        padding: 0.62rem 0.35rem;
      }

      .view-tabs button.active,
      .filters button.active {
        background: var(--app-surface);
        color: var(--app-ink);
        box-shadow: 0 0.45rem 1.2rem rgba(0, 0, 0, 0.12);
      }

      .hero-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 5.7rem;
        gap: 1rem;
        align-items: center;
        min-height: 8.8rem;
        border: 1px solid color-mix(in srgb, var(--app-ink) 11%, transparent);
        border-radius: calc(var(--app-radius) + 0.55rem);
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--app-surface) 94%, transparent),
            color-mix(in srgb, var(--app-surface) 74%, transparent)
          ),
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--app-accent) 23%, transparent),
            rgba(15, 143, 98, 0.14)
          );
        box-shadow: 0 1.4rem 3.2rem rgba(0, 0, 0, 0.15);
        padding: 0.95rem;
      }

      .hero-panel h2 {
        max-width: 12ch;
        margin-bottom: 0;
        font-size: 1.9rem;
        font-weight: 950;
        line-height: 1;
      }

      .hero-copy {
        margin: 0.55rem 0 0;
        color: color-mix(in srgb, var(--app-ink) 66%, transparent);
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .progress-ring {
        --progress: 0%;
        display: flex;
        width: 5.25rem;
        aspect-ratio: 1;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background:
          radial-gradient(circle, var(--app-surface) 0 58%, transparent 59%),
          conic-gradient(
            var(--app-accent) var(--progress),
            color-mix(in srgb, var(--app-ink) 12%, transparent) 0
          );
      }

      .progress-ring span {
        font-size: 1.6rem;
        font-weight: 950;
      }

      .progress-ring small {
        color: color-mix(in srgb, var(--app-ink) 64%, transparent);
        font-size: 0.78rem;
        font-weight: 850;
      }

      .composer,
      .category-panel,
      .settings-card {
        display: grid;
        gap: 0.65rem;
        border: 1px solid color-mix(in srgb, var(--app-ink) 11%, transparent);
        border-radius: var(--app-radius);
        background: color-mix(in srgb, var(--app-surface) 92%, transparent);
        box-shadow: 0 0.85rem 2rem rgba(0, 0, 0, 0.1);
        padding: 0.68rem;
      }

      .composer,
      .category-panel {
        margin-top: 0.7rem;
      }

      input,
      select {
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid transparent;
        border-radius: calc(var(--app-radius) * 0.72);
        background: color-mix(in srgb, var(--app-bg) 72%, var(--app-surface) 28%);
        color: var(--app-ink);
        outline: 0;
        padding: 0 0.9rem;
      }

      input:focus,
      select:focus {
        border-color: color-mix(in srgb, var(--app-accent) 62%, transparent);
        background: var(--app-surface);
      }

      .composer-row,
      .quick-category-form,
      .category-form,
      .category-editor article {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 3rem 2.8rem;
        gap: 0.48rem;
      }

      .composer-row {
        grid-template-columns: minmax(0, 1fr) 3rem;
      }

      input[type="color"] {
        min-height: 2.75rem;
        padding: 0.2rem;
      }

      .add-button,
      .quick-category-form button,
      .category-form button {
        min-height: 2.75rem;
        border-radius: calc(var(--app-radius) * 0.72);
        background: var(--app-accent);
        color: #fff;
        font-size: 1.45rem;
        font-weight: 900;
      }

      .priority-group,
      .segmented-field div {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.35rem;
        border-radius: calc(var(--app-radius) * 0.8);
        background: color-mix(in srgb, var(--app-bg) 78%, #000 8%);
        padding: 0.25rem;
      }

      .priority-group button,
      .segmented-field button {
        min-height: 2.3rem;
        border-radius: calc(var(--app-radius) * 0.62);
        padding: 0.5rem 0.35rem;
      }

      .priority-group button.selected,
      .segmented-field button.selected {
        background: var(--app-ink);
        color: var(--app-surface);
      }

      .category-panel-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(8.4rem, 42%);
        gap: 0.55rem;
      }

      .category-panel-head h2,
      .settings-heading h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 950;
        line-height: 1.1;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.42rem;
      }

      .category-grid button {
        --chip: var(--app-accent);
        min-height: 2.25rem;
        border: 1px solid color-mix(in srgb, var(--chip) 46%, transparent);
        border-radius: calc(var(--app-radius) * 0.75);
        background: color-mix(in srgb, var(--chip) 14%, var(--app-surface) 86%);
        color: var(--app-ink);
        padding: 0.45rem 0.35rem;
      }

      .category-grid button.active {
        background: var(--chip);
        color: #fff;
      }

      .task-list,
      .cosmetics-panel {
        display: grid;
        align-content: start;
        gap: 0.65rem;
        flex: 1;
        margin-top: 0.75rem;
        padding-bottom: 1rem;
      }

      .task-card {
        --category: var(--app-accent);
        display: grid;
        grid-template-columns: 2.55rem minmax(0, 1fr) 2.2rem;
        gap: 0.58rem;
        align-items: center;
        min-height: 4.55rem;
        border: 1px solid color-mix(in srgb, var(--app-ink) 10%, transparent);
        border-left: 0.36rem solid var(--category);
        border-radius: var(--app-radius);
        background: color-mix(in srgb, var(--app-surface) 94%, transparent);
        padding: var(--density-pad);
        box-shadow: 0 0.65rem 1.55rem rgba(0, 0, 0, 0.09);
      }

      .task-card.done {
        opacity: 0.62;
      }

      .check-button {
        width: 2.35rem;
        height: 2.35rem;
        border: 2px solid color-mix(in srgb, var(--category) 42%, var(--app-bg));
        border-radius: calc(var(--app-radius) * 0.72);
        background: color-mix(in srgb, var(--category) 12%, var(--app-surface));
        color: #fff;
        font-size: 1.05rem;
        font-weight: 950;
      }

      .task-card.done .check-button {
        border-color: var(--category);
        background: var(--category);
      }

      .task-line {
        justify-content: space-between;
        gap: 0.45rem;
      }

      .task-line h3 {
        min-width: 0;
        margin: 0;
        font-size: 0.98rem;
        font-weight: 900;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .task-line span,
      .task-meta b {
        flex: 0 0 auto;
        border-radius: 999px;
        font-size: 0.66rem;
        font-weight: 850;
        padding: 0.26rem 0.45rem;
      }

      .task-line span {
        background: color-mix(in srgb, var(--app-bg) 78%, var(--app-ink) 8%);
        color: color-mix(in srgb, var(--app-ink) 70%, transparent);
      }

      .task-meta {
        min-width: 0;
        gap: 0.45rem;
        margin-top: 0.2rem;
      }

      .task-meta b {
        --dot: var(--app-accent);
        background: color-mix(in srgb, var(--dot) 16%, var(--app-surface));
        color: var(--dot);
        font-weight: 900;
      }

      .task-meta p {
        min-width: 0;
        margin: 0;
        color: color-mix(in srgb, var(--app-ink) 62%, transparent);
        font-size: 0.82rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .task-card.done h3,
      .task-card.done p {
        text-decoration: line-through;
      }

      .delete-button {
        width: 2.1rem;
        height: 2.1rem;
        border-radius: calc(var(--app-radius) * 0.65);
        background: transparent;
        color: color-mix(in srgb, var(--app-ink) 58%, transparent);
        font-size: 1rem;
        font-weight: 950;
      }

      .empty-state {
        display: grid;
        min-height: 9rem;
        place-items: center;
        border: 1px dashed color-mix(in srgb, var(--app-ink) 25%, transparent);
        border-radius: var(--app-radius);
        background: color-mix(in srgb, var(--app-surface) 48%, transparent);
        text-align: center;
      }

      .settings-card {
        padding: 0.85rem;
      }

      .settings-card label,
      .segmented-field > span {
        display: grid;
        gap: 0.35rem;
        color: color-mix(in srgb, var(--app-ink) 70%, transparent);
        font-size: 0.78rem;
        font-weight: 850;
      }

      .palette-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.38rem;
      }

      .palette-grid button {
        display: grid;
        min-height: 3.5rem;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--app-ink) 10%, transparent);
        border-radius: calc(var(--app-radius) * 0.75);
        background: color-mix(in srgb, var(--app-bg) 70%, var(--app-surface));
        color: var(--app-ink);
        font-size: 0.66rem;
        padding: 0.36rem;
      }

      .palette-grid span {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 999px;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.45rem;
      }

      .segmented-field {
        display: grid;
        gap: 0.42rem;
      }

      .category-editor {
        display: grid;
        gap: 0.45rem;
      }

      .category-editor article {
        grid-template-columns: 3rem minmax(0, 1fr) 2.55rem;
      }

      .category-editor button {
        border: 0;
        border-radius: calc(var(--app-radius) * 0.7);
        background: color-mix(in srgb, var(--app-ink) 9%, transparent);
        color: var(--app-ink);
        cursor: pointer;
        font-weight: 950;
      }

      .reset-button {
        min-height: 2.8rem;
        border-radius: calc(var(--app-radius) * 0.8);
        background: color-mix(in srgb, var(--app-ink) 92%, transparent);
        color: var(--app-surface);
        font-weight: 900;
      }

      .hidden {
        display: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (min-width: 760px) {
        .app-root {
          display: grid;
          place-items: center;
          padding: 1.5rem;
        }

        .phone-shell {
          max-height: 900px;
          min-height: min(900px, calc(100vh - 3rem));
          border: 1px solid color-mix(in srgb, var(--app-ink) 10%, transparent);
          border-radius: 2rem;
          background: color-mix(in srgb, var(--app-bg) 62%, transparent);
          box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.18);
          overflow-y: auto;
        }
      }

      @media (max-width: 370px) {
        .hero-panel {
          grid-template-columns: minmax(0, 1fr);
        }

        .palette-grid,
        .color-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="app-root" id="appRoot">
      <section class="phone-shell">
        <header class="app-topbar">
          <div>
            <p class="eyebrow" id="viewLabel">Heute</p>
            <h1 id="appTitle">Pulse Tasks</h1>
          </div>
          <button
            class="icon-button"
            type="button"
            id="clearDone"
            aria-label="Erledigte Aufgaben entfernen"
            title="Erledigte entfernen"
          >
            x
          </button>
        </header>

        <nav class="view-tabs" aria-label="App Bereiche">
          <button class="active" type="button" data-view="tasks">Tasks</button>
          <button type="button" data-view="cosmetics">Cosmetics</button>
        </nav>

        <section id="tasksView">
          <section class="hero-panel" aria-label="Tagesfortschritt">
            <div>
              <p class="hero-kicker">Dein Tag in Bewegung</p>
              <h2 id="heroTitle">0 offene Aufgaben</h2>
              <p class="hero-copy" id="heroCopy"></p>
            </div>
            <div class="progress-ring" id="progressRing">
              <span id="progressText">0</span><small>%</small>
            </div>
          </section>

          <form class="composer" id="taskForm">
            <label class="sr-only" for="taskTitle">Neue Aufgabe</label>
            <input id="taskTitle" placeholder="Was steht als N&auml;chstes an?" maxlength="72" />

            <label class="sr-only" for="taskNote">Notiz</label>
            <input id="taskNote" placeholder="Notiz optional" maxlength="90" />

            <div class="composer-row">
              <select id="taskCategory" aria-label="Kategorie ausw&auml;hlen"></select>
              <button class="add-button" type="submit" aria-label="Aufgabe hinzuf&uuml;gen">+</button>
            </div>

            <div class="priority-group" aria-label="Priorit&auml;t ausw&auml;hlen">
              <button type="button" data-priority="low">Leicht</button>
              <button class="selected" type="button" data-priority="medium">Normal</button>
              <button type="button" data-priority="high">Fokus</button>
            </div>
          </form>

          <nav class="filters" aria-label="Aufgaben filtern">
            <button class="active" type="button" data-filter="today">Heute</button>
            <button type="button" data-filter="all">Alle</button>
            <button type="button" data-filter="done">Erledigt</button>
          </nav>

          <section class="category-panel" aria-label="Kategorien">
            <div class="category-panel-head">
              <div>
                <p class="hero-kicker">Kategorien</p>
                <h2>Sortieren &amp; erstellen</h2>
              </div>
              <select id="categoryFilter" aria-label="Kategorie filtern"></select>
            </div>

            <form class="quick-category-form" id="quickCategoryForm">
              <input id="newCategoryName" placeholder="Neue Kategorie" maxlength="20" />
              <input id="newCategoryColor" aria-label="Kategoriefarbe" type="color" value="#246bfe" />
              <button type="submit">+</button>
            </form>

            <nav class="category-grid" id="categoryGrid" aria-label="Kategorien filtern"></nav>
          </section>

          <section class="task-list" id="taskList" aria-label="Aufgabenliste"></section>
        </section>

        <section class="cosmetics-panel hidden" id="cosmeticsView" aria-label="Cosmetics Einstellungen">
          <div class="settings-card">
            <div class="settings-heading">
              <p class="hero-kicker">Identity</p>
              <h2>Name &amp; Farben</h2>
            </div>
            <label>
              App Name
              <input id="themeAppName" maxlength="24" />
            </label>

            <div class="palette-grid" id="paletteGrid" aria-label="Farbvorlagen"></div>

            <div class="color-grid">
              <label>Accent<input id="themeAccent" type="color" /></label>
              <label>Background<input id="themeBackground" type="color" /></label>
              <label>Cards<input id="themeSurface" type="color" /></label>
              <label>Text<input id="themeInk" type="color" /></label>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-heading">
              <p class="hero-kicker">Layout</p>
              <h2>Look &amp; Feel</h2>
            </div>
            <div class="segmented-field">
              <span>Rundung</span>
              <div id="radiusGroup"></div>
            </div>
            <div class="segmented-field">
              <span>Dichte</span>
              <div id="densityGroup"></div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-heading">
              <p class="hero-kicker">Kategorien</p>
              <h2>Eigene Bereiche</h2>
            </div>
            <form class="category-form" id="categoryForm">
              <input id="newCategoryNameCosmetics" placeholder="Neue Kategorie" maxlength="20" />
              <input id="newCategoryColorCosmetics" aria-label="Kategoriefarbe" type="color" value="#246bfe" />
              <button type="submit">+</button>
            </form>
            <div class="category-editor" id="categoryEditor"></div>
            <button class="reset-button" type="button" id="resetCosmetics">Reset Cosmetics</button>
          </div>
        </section>
      </section>
    </main>

    <script>
      const taskStorageKey = "pulse-todo-tasks";
      const categoryStorageKey = "pulse-todo-categories";
      const themeStorageKey = "pulse-todo-theme";

      const defaultCategories = [
        { id: "cat-personal", name: "Privat", color: "#246bfe" },
        { id: "cat-work", name: "Arbeit", color: "#ef594c" },
        { id: "cat-ideas", name: "Ideen", color: "#0f8f62" },
        { id: "cat-fitness", name: "Fitness", color: "#9b5cff" },
      ];

      const defaultTheme = {
        appName: "Pulse Tasks",
        accent: "#246bfe",
        background: "#f5f4ee",
        surface: "#fffefa",
        ink: "#171a1f",
        radius: "soft",
        density: "cozy",
      };

      const starterTasks = [
        {
          id: "starter-1",
          title: "Morgenroutine planen",
          note: "10 Minuten, Kaffee, Ueberblick.",
          priority: "high",
          categoryId: "cat-personal",
          done: false,
          createdAt: new Date().toISOString(),
          due: "today",
        },
        {
          id: "starter-2",
          title: "Eine Sache wirklich fertig machen",
          note: "Kein Multitasking.",
          priority: "medium",
          categoryId: "cat-work",
          done: false,
          createdAt: new Date().toISOString(),
          due: "today",
        },
        {
          id: "starter-3",
          title: "Neue App-Farben testen",
          note: "Im Cosmetics Tab.",
          priority: "low",
          categoryId: "cat-ideas",
          done: true,
          createdAt: new Date().toISOString(),
          due: "soon",
        },
      ];

      const priorityCopy = {
        low: "Leicht",
        medium: "Normal",
        high: "Fokus",
      };

      const radiusValue = {
        sharp: "0.55rem",
        soft: "1.05rem",
        round: "1.45rem",
      };

      const palettes = [
        ["Ocean", "#246bfe", "#f5f4ee", "#fffefa", "#171a1f"],
        ["Matcha", "#0f8f62", "#eff6ee", "#fffefa", "#172018"],
        ["Candy", "#e94986", "#fff2f7", "#ffffff", "#21151b"],
        ["Night", "#9b5cff", "#15161d", "#222432", "#f7f3ff"],
        ["Solar", "#f2a51f", "#fff6df", "#fffefa", "#241b0d"],
      ];

      let view = "tasks";
      let filter = "today";
      let priority = "medium";
      let categoryFilter = "all";
      let tasks = readJson(taskStorageKey, starterTasks);
      let categories = readJson(categoryStorageKey, defaultCategories);
      let theme = { ...defaultTheme, ...readJson(themeStorageKey, defaultTheme) };

      if (!categories.length) categories = defaultCategories;
      tasks = tasks.map((task, index) => ({
        id: task.id || `task-${index}-${Date.now()}`,
        title: task.title || "Neue Aufgabe",
        note: task.note || "",
        priority: task.priority || "medium",
        categoryId: task.categoryId || categories[0].id,
        done: Boolean(task.done),
        createdAt: task.createdAt || new Date().toISOString(),
        due: task.due || "today",
      }));

      function readJson(key, fallback) {
        const saved = localStorage.getItem(key);
        if (!saved) return fallback;
        try {
          return JSON.parse(saved);
        } catch {
          return fallback;
        }
      }

      function saveAll() {
        localStorage.setItem(taskStorageKey, JSON.stringify(tasks));
        localStorage.setItem(categoryStorageKey, JSON.stringify(categories));
        localStorage.setItem(themeStorageKey, JSON.stringify(theme));
      }

      function $(id) {
        return document.getElementById(id);
      }

      function makeButton(text, className, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        if (className) button.className = className;
        button.addEventListener("click", onClick);
        return button;
      }

      function findCategory(id) {
        return categories.find((category) => category.id === id) || categories[0];
      }

      function applyTheme() {
        const root = $("appRoot");
        root.style.setProperty("--app-bg", theme.background);
        root.style.setProperty("--app-surface", theme.surface);
        root.style.setProperty("--app-accent", theme.accent);
        root.style.setProperty("--app-ink", theme.ink);
        root.style.setProperty("--app-radius", radiusValue[theme.radius]);
        root.style.setProperty(
          "--density-pad",
          theme.density === "compact" ? "0.52rem" : "0.72rem",
        );
        $("appTitle").textContent = theme.appName || "Pulse Tasks";
        document.title = theme.appName || "Pulse Tasks";
      }

      function stats() {
        const total = tasks.length;
        const done = tasks.filter((task) => task.done).length;
        const open = total - done;
        const focus = tasks.filter((task) => !task.done && task.priority === "high").length;
        const progress = total ? Math.round((done / total) * 100) : 0;
        return { total, done, open, focus, progress };
      }

      function renderHero() {
        const data = stats();
        $("heroTitle").textContent = data.open ? `${data.open} offene Aufgaben` : "Alles erledigt";
        $("heroCopy").textContent = data.focus
          ? `${data.focus} Fokus-Aufgabe zuerst. Danach wird es leichter.`
          : "Sauber. Du kannst neue Aufgaben sammeln oder kurz durchatmen.";
        $("progressText").textContent = data.progress;
        $("progressRing").style.setProperty("--progress", `${data.progress}%`);
      }

      function renderSelects() {
        const taskCategory = $("taskCategory");
        const categorySelect = $("categoryFilter");
        taskCategory.replaceChildren();
        categorySelect.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "all";
        allOption.textContent = "Alle Kategorien";
        categorySelect.append(allOption);

        categories.forEach((category) => {
          const taskOption = document.createElement("option");
          taskOption.value = category.id;
          taskOption.textContent = category.name;
          taskCategory.append(taskOption);

          const filterOption = document.createElement("option");
          filterOption.value = category.id;
          filterOption.textContent = category.name;
          categorySelect.append(filterOption);
        });

        if (!categories.some((category) => category.id === taskCategory.value)) {
          taskCategory.value = categories[0].id;
        }
        categorySelect.value = categoryFilter;
      }

      function renderCategoryGrid() {
        const grid = $("categoryGrid");
        grid.replaceChildren();
        const allButton = makeButton("Alle", categoryFilter === "all" ? "active" : "", () => {
          categoryFilter = "all";
          render();
        });
        grid.append(allButton);

        categories.forEach((category) => {
          const button = makeButton(
            category.name,
            categoryFilter === category.id ? "active" : "",
            () => {
              categoryFilter = category.id;
              render();
            },
          );
          button.style.setProperty("--chip", category.color);
          grid.append(button);
        });
      }

      function visibleTasks() {
        return tasks.filter((task) => {
          if (filter === "done" && !task.done) return false;
          if (filter === "today" && (task.done || task.due !== "today")) return false;
          if (categoryFilter !== "all" && task.categoryId !== categoryFilter) return false;
          return true;
        });
      }

      function renderTasks() {
        const list = $("taskList");
        list.replaceChildren();
        const items = visibleTasks();

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const inner = document.createElement("div");
          const title = document.createElement("p");
          title.textContent = "Hier ist gerade Luft.";
          const copy = document.createElement("span");
          copy.textContent = "Fuege oben eine neue Aufgabe hinzu.";
          inner.append(title, copy);
          empty.append(inner);
          list.append(empty);
          return;
        }

        items.forEach((task) => {
          const category = findCategory(task.categoryId);
          const card = document.createElement("article");
          card.className = `task-card ${task.done ? "done" : ""}`;
          card.style.setProperty("--category", category.color);

          const check = makeButton(task.done ? "ok" : "", "check-button", () => {
            tasks = tasks.map((item) =>
              item.id === task.id ? { ...item, done: !item.done } : item,
            );
            saveAll();
            render();
          });
          check.setAttribute("aria-label", task.done ? "Aufgabe wieder oeffnen" : "Aufgabe erledigen");

          const content = document.createElement("div");
          content.className = "task-content";
          const line = document.createElement("div");
          line.className = "task-line";
          const title = document.createElement("h3");
          title.textContent = task.title;
          const priorityLabel = document.createElement("span");
          priorityLabel.textContent = priorityCopy[task.priority];
          line.append(title, priorityLabel);

          const meta = document.createElement("div");
          meta.className = "task-meta";
          const categoryLabel = document.createElement("b");
          categoryLabel.textContent = category.name;
          categoryLabel.style.setProperty("--dot", category.color);
          meta.append(categoryLabel);
          if (task.note) {
            const note = document.createElement("p");
            note.textContent = task.note;
            meta.append(note);
          }
          content.append(line, meta);

          const remove = makeButton("x", "delete-button", () => {
            tasks = tasks.filter((item) => item.id !== task.id);
            saveAll();
            render();
          });
          remove.setAttribute("aria-label", "Aufgabe loeschen");

          card.append(check, content, remove);
          list.append(card);
        });
      }

      function renderCosmetics() {
        $("themeAppName").value = theme.appName;
        $("themeAccent").value = theme.accent;
        $("themeBackground").value = theme.background;
        $("themeSurface").value = theme.surface;
        $("themeInk").value = theme.ink;

        const editor = $("categoryEditor");
        editor.replaceChildren();
        categories.forEach((category) => {
          const row = document.createElement("article");
          const color = document.createElement("input");
          color.type = "color";
          color.value = category.color;
          color.setAttribute("aria-label", `${category.name} Farbe`);
          color.addEventListener("input", () => {
            category.color = color.value;
            saveAll();
            render();
          });

          const name = document.createElement("input");
          name.value = category.name;
          name.maxLength = 20;
          name.setAttribute("aria-label", `${category.name} Name`);
          name.addEventListener("input", () => {
            category.name = name.value;
            saveAll();
            render();
          });

          const remove = makeButton("x", "", () => deleteCategory(category.id));
          remove.setAttribute("aria-label", `${category.name} loeschen`);
          row.append(color, name, remove);
          editor.append(row);
        });
      }

      function renderPalettes() {
        const grid = $("paletteGrid");
        grid.replaceChildren();
        palettes.forEach(([name, accent, background, surface, ink]) => {
          const button = makeButton(name, "", () => {
            theme = { ...theme, accent, background, surface, ink };
            saveAll();
            render();
          });
          const swatch = document.createElement("span");
          swatch.style.background = accent;
          button.prepend(swatch);
          grid.append(button);
        });
      }

      function renderSegmented(id, values, current, update) {
        const group = $(id);
        group.replaceChildren();
        values.forEach((value) => {
          const button = makeButton(value, current === value ? "selected" : "", () => {
            update(value);
            saveAll();
            render();
          });
          group.append(button);
        });
      }

      function renderView() {
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === view);
        });
        $("tasksView").classList.toggle("hidden", view !== "tasks");
        $("cosmeticsView").classList.toggle("hidden", view !== "cosmetics");
        $("viewLabel").textContent = view === "tasks" ? "Heute" : "Customize";
      }

      function renderFilters() {
        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === filter);
        });
        document.querySelectorAll("[data-priority]").forEach((button) => {
          button.classList.toggle("selected", button.dataset.priority === priority);
        });
      }

      function render() {
        applyTheme();
        renderView();
        renderFilters();
        renderHero();
        renderSelects();
        renderCategoryGrid();
        renderTasks();
        renderCosmetics();
        renderPalettes();
        renderSegmented("radiusGroup", ["sharp", "soft", "round"], theme.radius, (value) => {
          theme.radius = value;
        });
        renderSegmented("densityGroup", ["cozy", "compact"], theme.density, (value) => {
          theme.density = value;
        });
      }

      function addCategory(nameInputId, colorInputId) {
        const nameInput = $(nameInputId);
        const colorInput = $(colorInputId);
        const name = nameInput.value.trim();
        if (!name) return;

        const category = {
          id: crypto.randomUUID(),
          name,
          color: colorInput.value,
        };
        categories.push(category);
        $("taskCategory").value = category.id;
        nameInput.value = "";
        saveAll();
        render();
      }

      function deleteCategory(id) {
        if (categories.length <= 1) return;
        const fallback = categories.find((category) => category.id !== id);
        categories = categories.filter((category) => category.id !== id);
        tasks = tasks.map((task) =>
          task.categoryId === id ? { ...task, categoryId: fallback.id } : task,
        );
        if (categoryFilter === id) categoryFilter = "all";
        saveAll();
        render();
      }

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", () => {
          view = button.dataset.view;
          render();
        });
      });

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      document.querySelectorAll("[data-priority]").forEach((button) => {
        button.addEventListener("click", () => {
          priority = button.dataset.priority;
          render();
        });
      });

      $("taskForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const title = $("taskTitle").value.trim();
        if (!title) return;
        tasks.unshift({
          id: crypto.randomUUID(),
          title,
          note: $("taskNote").value.trim(),
          priority,
          categoryId: $("taskCategory").value || categories[0].id,
          done: false,
          createdAt: new Date().toISOString(),
          due: "today",
        });
        $("taskTitle").value = "";
        $("taskNote").value = "";
        priority = "medium";
        filter = "today";
        saveAll();
        render();
      });

      $("quickCategoryForm").addEventListener("submit", (event) => {
        event.preventDefault();
        addCategory("newCategoryName", "newCategoryColor");
      });

      $("categoryForm").addEventListener("submit", (event) => {
        event.preventDefault();
        addCategory("newCategoryNameCosmetics", "newCategoryColorCosmetics");
      });

      $("categoryFilter").addEventListener("change", (event) => {
        categoryFilter = event.target.value;
        render();
      });

      $("clearDone").addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.done);
        saveAll();
        render();
      });

      $("themeAppName").addEventListener("input", (event) => {
        theme.appName = event.target.value;
        saveAll();
        render();
      });
      $("themeAccent").addEventListener("input", (event) => {
        theme.accent = event.target.value;
        saveAll();
        render();
      });
      $("themeBackground").addEventListener("input", (event) => {
        theme.background = event.target.value;
        saveAll();
        render();
      });
      $("themeSurface").addEventListener("input", (event) => {
        theme.surface = event.target.value;
        saveAll();
        render();
      });
      $("themeInk").addEventListener("input", (event) => {
        theme.ink = event.target.value;
        saveAll();
        render();
      });

      $("resetCosmetics").addEventListener("click", () => {
        theme = { ...defaultTheme };
        categories = defaultCategories.map((category) => ({ ...category }));
        tasks = tasks.map((task) => ({ ...task, categoryId: categories[0].id }));
        categoryFilter = "all";
        saveAll();
        render();
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }

      render();
    </script>
  </body>
</html>
